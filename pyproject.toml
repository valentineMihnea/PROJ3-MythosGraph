[project]
name = "mythos-graph"
version = "0.1.0"
description = "Hellenic Kinship & Mythological Relationship Engine"
authors = [
    { name = "Ghita Mihnea-Valentin", email = "keox.ds@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic (>=2.9,<3.0)",
    "fastapi (>=0.115)",
    "uvicorn (>=0.32)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "mythos_graph", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=6.0"
ruff = ">=0.8"
black = ">=24.10"
mypy = ">=1.13"
pre-commit = ">=4.0"
hypothesis = ">=6.100"
httpx = ">=0.27"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["src/mythos_graph"]
